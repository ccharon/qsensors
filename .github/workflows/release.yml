name: Release

# Releases are cut by pushing a tag vX.Y.Z that points to a commit on main.
# Both AppImages are built and tested, then attached to a draft GitHub release;
# publishing the draft stays a manual step.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi
          CMAKE_VERSION="$(sed -nE 's/^project\(qsensors VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)"
          if [ "$CMAKE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match CMakeLists.txt version $CMAKE_VERSION"
            exit 1
          fi
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  appimage:
    needs: validate
    uses: ./.github/workflows/appimage.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  release:
    needs: [validate, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download AppImages and notes
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/appimage-*/qsensors-*.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "qsensors $VERSION" \
            --notes-file artifacts/release-notes/release-notes.md
