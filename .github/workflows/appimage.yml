name: AppImage

# Reusable build of both AppImages; called by ci.yml for every change and by
# release.yml for tags, so CI exercises exactly the release path.
on:
  workflow_call:
    inputs:
      version:
        description: Version used in the AppImage file names
        required: true
        type: string

permissions:
  contents: read

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The container's glibc is the AppImage's minimum glibc.
          # Images are pinned by digest (the tag stays for readability; the digest wins).
          # Dependabot cannot update these: its docker ecosystem reads Dockerfiles and
          # compose files, not a workflow matrix. To update, resolve the new digest and
          # replace it here:
          #   ubuntu (multi-arch index, covers amd64 and arm64):
          #     TOKEN=$(curl -s 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/ubuntu:pull' | jq -r .token)
          #     curl -sI -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.oci.image.index.v1+json' \
          #       https://registry-1.docker.io/v2/library/ubuntu/manifests/24.04 | grep -i docker-content-digest
          #   manylinux (x86_64-only repository, so a single-arch manifest):
          #     curl -sI -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
          #       https://quay.io/v2/pypa/manylinux_2_28_x86_64/manifests/latest | grep -i docker-content-digest
          - arch: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64:latest@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c # AlmaLinux 8, glibc 2.28
          # Official Qt arm64 binaries need glibc 2.38, so an older base gains nothing.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8 # glibc 2.39
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install git
        if: matrix.arch == 'aarch64'
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes or fetches; build.sh runs downloaded code.
          persist-credentials: false

      - name: Cache Qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .appimage-work/qt
          key: qt-${{ matrix.arch }}-${{ hashFiles('packaging/appimage/build.sh') }}

      - name: Build and test AppImage
        env:
          VERSION: ${{ inputs.version }}
        run: bash packaging/appimage/build.sh

      - name: Verify translations are up to date
        if: matrix.arch == 'x86_64'
        run: |
          # The workspace belongs to another user inside the container; without this
          # git treats it as untrusted and does not see the repository.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="$PWD/.appimage-work/venv/bin:$PATH"
          cmake --build .appimage-work/build --target update_translations
          if ! git diff --quiet -- i18n/qsensors_*.ts; then
            echo "::error::Translation sources are outdated. Run: cmake --build build --target update_translations"
            git --no-pager diff -- i18n/qsensors_*.ts
            exit 1
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/qsensors-*.AppImage
          if-no-files-found: error
          retention-days: 14
